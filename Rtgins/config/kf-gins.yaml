# ==============================================================================
# KF-GINS 松组合导航配置文件
# ==============================================================================
# 整体说明：
#   所有参数按功能分 5 组：文件路径 → IMU数据 → 初始状态 → 初始不确定性 → IMU噪声模型 → 硬件安装
#   单位约定：角度[deg]、长度[m]、速度[m/s]、时间[s]、角速度[deg/h]、加速度[mGal]
#
#   F = 前(Forward)、R = 右(Right)、D = 下(Down)  —  IMU 载体坐标系，右手坐标系
#   N = 北(North)、E = 东(East)、D = 地(Down)     —  导航坐标系(n系)，东北天约定也有
# ==============================================================================

# ------------------------------------------------------------------------------
# 第一组：文件路径
# ------------------------------------------------------------------------------

# IMU 原始数据文件路径
#   格式要求：纯文本，列分隔，前7列必须是 [时间, gx, gy, gz, ax, ay, az]
#   陀螺仪角速度单位 rad/s 或 deg/s（代码里自动识别），加计单位 m/s²
imupath: ""

# GNSS 解算结果文件路径（松组合的GNSS输入，不是原始观测值）
#   格式要求：前8列 [时间, 纬度deg, 经度deg, 高度m, 北速m/s, 东速m/s, 地速m/s, 位置标准差3列, 速度标准差3列, 航向deg, 航向标准差deg]
#   航向为双天线航向(0~360°)，没有双天线时航向列为空
gnsspath: ""

# 输出文件夹：KF-GINS_Navresult.nav (导航结果)、KF_GINS_STD.txt (状态标准差)
outputpath: ""

# ------------------------------------------------------------------------------
# 第二组：IMU 数据参数
# ------------------------------------------------------------------------------

# IMU 数据文件总列数（只会读取前7列，多余列忽略）
imudatalen: 7

# IMU 原始采样率 [Hz]
#   直接决定 dt（机械编排积分步长），也决定离散噪声 Qd = Qc × dt 的大小
#   常见值：100 / 200 / 400 / 1000
imudatarate: 200

# 处理时间段 [秒]
#   starttime：从 IMU 文件第几秒开始解算（0 = 从开头）
#   endtime：处理到第几秒结束（0 或 -1 = 处理到文件末尾）
starttime: 0
endtime: 0

# ------------------------------------------------------------------------------
# 第三组：初始状态（KF 在 k=0 时刻的标称状态）
# ------------------------------------------------------------------------------

# 初始位置 [纬度deg, 经度deg, 高度m]
#   来源：GNSS 静止5秒平均 / 手动输入 / 上一次解算结果
#   注意：纬度不能直接塞 30.5 这种近似值，差 0.01° = 差 ~1.1km
initpos: [ 30.5, 114, 20 ]

# 初始速度 [北速m/s, 东速m/s, 地速m/s]
#   静止时全填 0；车动起来填 GNSS 速度的平均
initvel: [ 0.0, 0.0, 0.0 ]

# 初始姿态 [横滚deg, 俯仰deg, 航向deg]，ZYX旋转顺序
#   来源：水平静止时 roll/pitch 可设 0（靠重力可观）；yaw 必须给 GNSS 航向（否则不可观）
#   注意：航向不可观是惯导核心问题，没有GNSS航向的话 yaw 会按 t³ 发散
initatt: [ 0.0, 0.0, 0.0 ]

# 陀螺初始零偏 [deg/h]，IMU F/R/D 三轴
#   来源：开机静止 10~30 秒，取陀螺输出均值
#   代码里 KF 会在线估计并修正这个值，这里给的是初始猜测
initgyrbias: [ 0, 0, 0 ]

# 加计初始零偏 [mGal]（1 Gal = 1 cm/s²，1 mGal = 1e-5 m/s²）
#   来源：开机静止取加计输出均值（注意静止时 a_z ≈ -9.8 m/s² = -980 Gal，零偏是偏离这个值的部分）
initaccbias: [ 0, 0, 0 ]

# 陀螺初始标度因子误差 [ppm]（1 ppm = 1e-6，百万分之一）
#   好 MEMS 陀螺标度因子稳定性 ~100 ppm 量级；精密光纤陀螺 ~1 ppm
#   一般开机没法标定，填 0 让 KF 在线估
initgyrscale: [ 0, 0, 0 ]

# 加计初始标度因子误差 [ppm]，一般填 0
initaccscale: [ 0, 0, 0 ]

# ------------------------------------------------------------------------------
# 第四组：初始不确定性（KF 在 k=0 时刻的协方差对角线 √P）
# ------------------------------------------------------------------------------
# 这组值的物理意义是"你对上面第三组初始状态有多不确定"
# 填得大 = KF 认为初始值不准，会更快信任新的 GNSS 观测
# 填得小 = KF 坚信初始值，对 GNSS 新息反应慢
#
# 经验值：GNSS RTK 固定解 → posstd 0.1m 量级；单点定位 → posstd 2~5m

# 初始位置标准差 [北m, 东m, 地m]
#   RTK 固定解：0.1m / 0.1m / 0.2m 合理
#   单点定位：2m / 2m / 3m
initposstd: [ 0.1, 0.1, 0.2 ]

# 初始速度标准差 [北m/s, 东m/s, 地m/s]
initvelstd: [ 0.05, 0.05, 0.05 ]

# 初始姿态标准差 [横滚deg, 俯仰deg, 航向deg]
#   roll/pitch 靠重力可观，小角度填 0.5° 合理
#   yaw 不可观，有 GNSS 航向时填 1°；没有的话可以填 30° 甚至 90°（让 KF 快速对齐）
initattstd: [ 0.5, 0.5, 1.0 ]

# 初始零偏和标度因子标准差（KF 会在线估这些状态，这里给初始 P 的对角）
# 注释掉表示让代码自动按下面 IMU 噪声参数给值；如果想手动控制就取消注释
#initbgstd: [ 50, 50, 50 ]          # 陀螺零偏初始标准差 [deg/h]
#initbastd: [ 250, 250, 250 ]       # 加计零偏初始标准差 [mGal]
#initsgstd: [ 1000, 1000, 1000 ]    # 陀螺标度因子初始标准差 [ppm]
#initsastd: [ 1000, 1000, 1000 ]    # 加计标度因子初始标准差 [ppm]

# ------------------------------------------------------------------------------
# 第五组：IMU 噪声建模参数 → Qc 矩阵的来源
# ------------------------------------------------------------------------------
# 这组值来自 Allan 方差标定！
#   拿到一块新 IMU → 静止采集 1~2 小时原始数据 → 做 Allan 方差 → 读出下面参数
#
# Qc 矩阵里 6 个对角块 18×18 全部由这里的值构造（gi_engine.cpp L66~L75）：
#   ARW → 姿态误差φ的过程噪声
#   VRW → 速度误差的过程噪声
#   bgstd + corrtime → 陀螺零偏状态b_g的随机游走Qc = 2σ²/τ
#   abstd + corrtime → 加计零偏状态b_a的随机游走Qc = 2σ²/τ
#   gsstd + corrtime → 陀螺标度因子状态s_g的随机游走Qc
#   asstd + corrtime → 加计标度因子状态s_a的随机游走Qc
#
# 没有GNSS约束时，P矩阵每帧被 Qd = G·Qc·Gᵀ·dt 撑大 → 输出误差无限涨

imunoise:
  # 角度随机游走 ARW [deg/√h]
  #   Allan 方差 -1/2 斜率段读出的值
  #   物理意义：陀螺白噪声每积分 √1h 贡献多少度的姿态误差
  #   典型值：好MEMS 0.1~0.5，普通MEMS 0.5~2.0，光纤陀螺 0.001~0.01
  arw: [0.24, 0.24, 0.24]

  # 速度随机游走 VRW [m/s/√h]
  #   加计白噪声对应的 Allan 方差值
  vrw: [0.24, 0.24, 0.24]

  # 陀螺零偏不稳定性 [deg/h]
  #   Allan 方差曲线最低点（0 斜率段）的 σ 值
  #   一阶马尔可夫模型的稳态标准差；corrtime 相关时间 τ 决定了 Qc = 2σ²/τ
  #   典型值：好MEMS 5~20°/h，普通MEMS 20~100°/h，光纤陀螺 0.01~0.5°/h
  gbstd: [50.0, 50.0, 50.0]

  # 加计零偏不稳定性 [mGal]
  abstd: [250.0, 250.0, 250.0]

  # 陀螺标度因子不稳定性 [ppm]
  gsstd: [1000.0, 1000.0, 1000.0]

  # 加计标度因子不稳定性 [ppm]
  asstd: [1000.0, 1000.0, 1000.0]

  # 零偏/标度因子一阶马尔可夫相关时间 [小时]
  #   τ 越大 → 过程噪声 Qc 越小 → KF 越相信"当前零偏状态变化慢"
  #   τ=1h 是保守值；实际可以设 0.5~2h 之间
  corrtime: 1.0

# ------------------------------------------------------------------------------
# 第六组：硬件安装参数
# ------------------------------------------------------------------------------

# GNSS 天线杆臂 [前m, 右m, 下m]
#   IMU 坐标系下，GNSS 天线相位中心相对于 IMU 中心的位置偏移
#   松组合里这个值进 GNSS 位置观测模型：天线位置 = IMU位置 + C_b^n × antlever
#   杆臂没填对会导致 GNSS 位置观测和 IMU 积分位置不一致 → 新息 dz 带假信号
#   如果后续要做"杆臂在线估计"，这组值就是在线估计的标称初值
antlever: [ 0.136, -0.301, -0.184 ]
