<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>双天线基线高度差示意</title>
<style>
  body { margin: 0; padding: 20px; background: #1a1a2e; color: #eee; font-family: 'Segoe UI', sans-serif; }
  h2 { text-align: center; color: #e0e0e0; }
  .container { max-width: 700px; margin: 0 auto; }
  svg { display: block; margin: 0 auto; background: #16213e; border-radius: 8px; }
  .legend { margin-top: 16px; font-size: 14px; line-height: 1.8; }
  .legend .item { display: flex; align-items: center; gap: 8px; }
  .legend .swatch { width: 24px; height: 4px; border-radius: 2px; }
  .formula { background: #0f3460; padding: 12px 16px; border-radius: 6px; font-family: 'Consolas', monospace; font-size: 13px; margin-top: 12px; line-height: 1.8; }
</style>
</head>
<body>
<div class="container">
<h2>双天线基线 — 高度差导致有效基线变短</h2>
<svg width="600" height="380" viewBox="0 0 600 380">
  <!-- 地面参考线 -->
  <line x1="60" y1="320" x2="540" y2="320" stroke="#444" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="55" y="336" fill="#888" font-size="12">地面 (水平面)</text>

  <!-- 天线1 (主天线) -->
  <circle cx="120" cy="160" r="16" fill="#e94560" stroke="#fff" stroke-width="2"/>
  <text x="100" y="146" fill="#e94560" font-size="13" font-weight="bold">主天线</text>
  <!-- 天线1 支架 -->
  <rect x="116" y="176" width="8" height="144" fill="#555"/>
  <text x="95" y="250" fill="#aaa" font-size="11">支架</text>

  <!-- 天线2 (从天线) -->
  <circle cx="440" cy="220" r="16" fill="#0f3460" stroke="#4cc9f0" stroke-width="2"/>
  <text x="408" y="208" fill="#4cc9f0" font-size="13" font-weight="bold">从天线</text>
  <!-- 天线2 支架 (矮) -->
  <rect x="436" y="236" width="8" height="84" fill="#555"/>

  <!-- 物理基线 (斜边) -->
  <line x1="120" y1="160" x2="440" y2="220" stroke="#e94560" stroke-width="3"/>
  <text x="250" y="175" fill="#e94560" font-size="13" font-weight="bold">物理基线 = √(dx²+dy²+dz²)</text>

  <!-- 高度差 dz -->
  <line x1="440" y1="160" x2="440" y2="220" stroke="#f5a623" stroke-width="2.5" stroke-dasharray="5,3"/>
  <text x="450" y="195" fill="#f5a623" font-size="13" font-weight="bold">dz (高度差)</text>

  <!-- 水平投影 -->
  <line x1="120" y1="160" x2="440" y2="160" stroke="#4cc9f0" stroke-width="3"/>
  <text x="210" y="152" fill="#4cc9f0" font-size="13" font-weight="bold">有效水平基线 = √(dx²+dy²)</text>

  <!-- 辅助虚线: 主天线到从天线正上方 -->
  <line x1="440" y1="160" x2="440" y2="220" stroke="#666" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- 标注变短 -->
  <text x="330" y="140" fill="#4cc9f0" font-size="12">← 变短了 →</text>

  <!-- 俯仰箭头 -->
  <path d="M 200 330 Q 300 305 400 330" fill="none" stroke="#888" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="270" y="355" fill="#888" font-size="11">车体俯仰/安装高度差</text>

  <!-- 天线1 水平标注 -->
  <text x="120" y="380" fill="#e94560" font-size="11" text-anchor="middle">h₁ = 160</text>
  <text x="440" y="380" fill="#4cc9f0" font-size="11" text-anchor="middle">h₂ = 220</text>
</svg>

<div class="legend">
  <div class="item"><div class="swatch" style="background:#e94560"></div> <span>物理基线（斜边）：两天线真实距离，固定不变</span></div>
  <div class="item"><div class="swatch" style="background:#4cc9f0"></div> <span>有效水平基线：水平投影，航向角由此算出</span></div>
  <div class="item"><div class="swatch" style="background:#f5a623"></div> <span>dz 高度差：安装/姿态导致，使水平投影变短</span></div>
</div>

<div class="formula">
航向角 heading = atan2(dy, dx)<br>
有效基线 = √(dx² + dy²) ＜ 物理基线 = √(dx² + dy² + dz²)<br><br>
<b>高度差越大 → 有效基线越短 → 航向角分辨率越差</b><br>
所以双天线安装要求：同高、同水平面、间距尽量大
</div>
</div>
</body>
</html>
